# ---------------------------------------------------------------------------
# Databricks Asset Bundle.
#
# This is the piece that makes the demo real: the same repo that SonarQube
# scans is the repo that deploys to Databricks. Sonar gates the merge;
# the bundle does the deploy.
#
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev
#   databricks bundle run customer_pipeline_job -t dev
#
# Two environments, two bundle targets, two GitHub Environments:
#
#   Bundle target | Purpose         | GitHub Environment | Approval required
#   --------------|-----------------|---------------------|-------------------
#   dev           | non-production  | non-production      | no (auto-deploy)
#   prod          | production      | production          | yes (required
#                 |                 |                      | reviewer, main
#                 |                 |                      | branch only)
#
# .github/workflows/cd.yml deploys "dev" and then "prod" after the "CI"
# workflow's SonarQube quality gate passes on a push to main. Code never
# reaches either target unless the gate already passed. Non-production and
# production stay isolated at the data layer too, not just by job name:
# see the `schema` variable per target below (demo_dev vs demo) and the
# separate workspace root_path per target.
# ---------------------------------------------------------------------------
bundle:
  name: DB-Sonar-Demo

include:
  - resources/*.yml

# The wheel built from src/ is uploaded and installed on the job cluster.
artifacts:
  customer_pipeline_wheel:
    type: whl
    build: python -m build --wheel
    path: .

variables:
  catalog:
    description: Unity Catalog catalog to write into
    default: main
  schema:
    description: Schema to write into
    default: demo

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-e56bb002-7c03.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: demo_dev

  prod:
    mode: production
    workspace:
      host: https://dbc-e56bb002-7c03.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: demo
    permissions:
      - level: CAN_VIEW
        group_name: data-consumers
