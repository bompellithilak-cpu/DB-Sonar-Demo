resources:
  jobs:
    customer_pipeline_job:
      name: "[${bundle.target}] Customer pipeline (Sonar demo)"

      tasks:
        # Task 1: build the bronze table with deliberately dirty rows so the
        # DQ rules have something to catch.
        - task_key: seed_sample_data
          notebook_task:
            notebook_path: ../notebooks/00_setup_sample_data.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        # Task 2: run the real pipeline from the wheel.
        - task_key: run_pipeline
          depends_on:
            - task_key: seed_sample_data
          notebook_task:
            notebook_path: ../notebooks/run_customer_pipeline.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          environment_key: pipeline_env

      # No job_clusters block: tasks with no cluster spec run on serverless
      # compute, which is what this workspace supports. Serverless tasks
      # can't take a `libraries` block directly - the wheel is declared as
      # a dependency of a named environment instead.
      environments:
        - environment_key: pipeline_env
          spec:
            client: "2"
            dependencies:
              - ../dist/*.whl

      queue:
        enabled: true
