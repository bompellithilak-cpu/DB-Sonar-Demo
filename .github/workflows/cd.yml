# ---------------------------------------------------------------------------
# CD: deploy the Databricks Asset Bundle after CI's quality gate passes.
#
# This only runs after the "CI" workflow (ci.yml -> sonar-scan-reusable.yml)
# finishes on a push to main. If the SonarQube quality gate failed, CI's
# conclusion is not "success" and nothing here runs — code that didn't pass
# the gate never reaches Databricks, non-production or production.
#
# Two GitHub Environments gate the two Databricks Asset Bundle targets:
#   non-production  -> bundle target "dev"   (schema demo_dev, auto-deploy)
#   production       -> bundle target "prod" (schema demo, requires a manual
#                        approval from a required reviewer before the job
#                        runs — configured under Settings > Environments)
#
# Required secrets (add these yourself under Settings > Environments, once
# per environment — they are never entered by an assistant/automation):
#   DATABRICKS_HOST   e.g. https://dbc-e56bb002-7c03.cloud.databricks.com
#   DATABRICKS_TOKEN  a Databricks personal access token (or service-
#                      principal token) with permission to deploy bundles
# ---------------------------------------------------------------------------
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy-nonprod:
    name: Deploy to non-production (dev target)
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: non-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install wheel build tooling
        run: python -m pip install --upgrade build

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/cli/main/install.sh | sh

      - name: Deploy bundle (dev target)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle deploy -t dev

  deploy-prod:
    name: Deploy to production (prod target)
    needs: deploy-nonprod
    runs-on: ubuntu-latest
    # This is the actual gate: the "production" GitHub Environment requires
    # a manual approval from a listed reviewer before this job is allowed to
    # start, and is restricted to the main branch. See Settings > Environments.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install wheel build tooling
        run: python -m pip install --upgrade build

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/cli/main/install.sh | sh

      - name: Deploy bundle (prod target)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle deploy -t prod
