# ---------------------------------------------------------------------------
# SonarQube configuration for a Databricks repo
# ---------------------------------------------------------------------------

sonar.projectKey=DB-Sonar-Demo
sonar.projectName=DB-Sonar-Demo
sonar.projectVersion=0.1.0

# What to scan: the Python package AND the notebooks.
# Databricks source-format notebooks are plain .py files, so Sonar reads them.
sonar.sources=src,notebooks
sonar.tests=tests

sonar.sourceEncoding=UTF-8
sonar.python.version=3.10,3.11

# --- Test results and coverage --------------------------------------------
# These two files are produced by `pytest` (see pytest.ini) BEFORE the scanner
# runs. Sonar does not run your tests; it only reads the reports.
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=junit.xml

# --- Coverage exclusions ---------------------------------------------------
# Thin Spark adapters and notebooks contain no business logic and cannot be
# unit-tested off-cluster, so they are excluded from the coverage requirement.
# They are STILL scanned for bugs, smells and secrets.
sonar.coverage.exclusions=\
  notebooks/**,\
  src/customer_pipeline/transforms.py,\
  src/customer_pipeline/transforms_legacy.py,\
  tests/**

# --- Full exclusions (not scanned at all) ----------------------------------
sonar.exclusions=\
  **/.databricks/**,\
  **/dist/**,\
  **/build/**,\
  **/__pycache__/**

# --- Import findings from the external PySpark linter ----------------------
# Sonar has no rule for .collect(), inferSchema=True or /mnt/ paths.
# scripts/pyspark_checks.py finds them and writes Sonar's generic issue format,
# so they appear on the same dashboard as the built-in rules.
sonar.externalIssuesReportPaths=pyspark-issues.json
